<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Oops! The recipe page you are looking for does not exist on FlavorBook. Go back home to browse catalog.">
  <title>FlavorBook – Page Not Found</title>
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark.css">
  
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body style="overflow-y: hidden;">

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-container">
      <div class="pot-wrapper">
        <div class="steam-container">
          <div class="steam"></div>
          <div class="steam"></div>
          <div class="steam"></div>
        </div>
        <div class="pot-lid"></div>
        <div class="pot-handle left"></div>
        <div class="pot-handle right"></div>
        <div class="pot"></div>
      </div>
      <div class="loading-percentage">0%</div>
      <div class="loading-progress">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <div class="error-wrapper container">
    
    <!-- Stylized Chef SVG with head-shake -->
    <div style="width: 200px; height: 200px; margin-bottom: 30px; display: flex; justify-content: center; align-items: center;">
      <svg class="chef-shaking" viewBox="0 0 100 100" style="width:100%; height:100%;">
        <!-- Chef Hat -->
        <path d="M30,35 C30,15 70,15 70,35" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="4"></path>
        <path d="M25,35 L75,35 L75,45 L25,45 Z" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="4"></path>
        <!-- Chef Face -->
        <circle cx="50" cy="62" r="18" fill="#FFD166" stroke="#2D2D2D" stroke-width="4"></circle>
        <!-- Eyes -->
        <circle cx="43" cy="60" r="2.5" fill="#2D2D2D"></circle>
        <circle cx="57" cy="60" r="2.5" fill="#2D2D2D"></circle>
        <!-- Mustache -->
        <path d="M35,66 C42,66 46,62 50,66 C54,62 58,66 65,66 C60,70 40,70 35,66" fill="#2D2D2D"></path>
        <!-- Rosy Cheeks -->
        <circle cx="36" cy="63" r="3" fill="#ff4757" opacity="0.3"></circle>
        <circle cx="64" cy="63" r="3" fill="#ff4757" opacity="0.3"></circle>
      </svg>
    </div>

    <h1 style="font-size: 3rem; color: var(--primary-color); margin-bottom: 15px; font-weight:800;">404 Error</h1>
    <h2 style="font-size: 1.8rem; color: var(--dark-color); margin-bottom: 15px;">Oops! Recipe Not Found</h2>
    <p style="color: var(--text-light); max-width: 500px; margin: 0 auto 35px auto; font-size:1.05rem;">
      Our kitchen experts searched everywhere, but this recipe page seems to have boiled over or gone out of stock! Let's get you back to the home kitchen.
    </p>

    <a href="index.html" class="btn btn-primary pulse-btn"><i class="fa-solid fa-house"></i> Go Back Home</a>

  </div>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/darkmode.js"></script>
</body>
</html>
